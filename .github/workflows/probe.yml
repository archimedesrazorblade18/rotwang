name: Probe

# A manual test run: runs radar.py with the given arguments and shows the
# output. Saves nothing.
on:
  workflow_dispatch:
    inputs:
      args:
        description: "Arguments for radar.py"
        required: true
        default: "--careers 60"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Run
        env:
          ARGS: ${{ inputs.args }}
          PYTHONUTF8: "1"
          RADAR_CAREERS_MIN: "40"
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          JSEARCH_API_KEY: ${{ secrets.JSEARCH_API_KEY }}
          CAREERJET_API_KEY: ${{ secrets.CAREERJET_API_KEY }}
        run: python radar.py $ARGS
